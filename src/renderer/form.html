<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Form</title>
</head>
<body>
    <h1>Add New Task</h1>
    <form id="taskForm">
        <input type="text" id="taskdescription" placeholder="Task Description" required>
        <button type="button" id="dateModeBtn">Fecha Especifica: </button>
        <button type="button" id="minutesModeBtn">Minutos: </button>
        <input type="datetime-local" id="duedate" required>
        <input type="number" id="minutes" style="display: none;" placeholder="Minutes">
        <input type="number" id="interval" placeholder="Interval">
        <button type="submit">Add Task</button>
    </form>
    <script src="./form.js"></script>
</body>
</html>
