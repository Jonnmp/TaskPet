<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskPet</title>
    <style>
  html {
    background: transparent;
  }
  body {
    margin: 0;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    -webkit-app-region: drag;
  }
  .mascot {
    width: 75px;
    height: 75px;
    position: relative;
    -webkit-app-region: no-drag;
  }
  .mascot-inner {
    width: 100%;
    height: 100%;
    animation: float 2.5s ease-in-out infinite;
  }
  .eye {
    width: 14px;
    height: 14px;
    background: #f5f5f5;
    border-radius: 50%;
    position: absolute;
    top: 36px;
  }
  .mouth {
    width: 20px;
    height: 15px;
    border-bottom: 3px solid #F5F5F5;
    border-radius: 0 0 20px 20px;
    position: absolute;
    top: 62px;
    left: 40px;
  }
  @keyframes float {
    0% {
        transform: translateY(0px);
    }
    50% {
        transform: translateY(-6px);
    }
    100% {
        transform: translateY(0px);
    }
}
.speech-bubble {
  position: absolute;
  background: rgba(40, 40, 40, 0.95);
  color: white;
  padding: 8px 12px;
  border-radius: 12px;
  top: -70px;
  opacity: 0;
  visibility: hidden;
  left: 50%;
  transform: translateX(-50%);
  white-space: normal;
  text-align: center;
  width: max-content;
  max-width: 160px;
}
.speech-bubble.show {
  opacity: 1;
  visibility: visible;
}

#AddTask_btn, #ViewTask {
  -webkit-app-region: no-drag;
  background: #54585a;
  color: white;
  border: none;
  border-radius: 50%;
  width: 32px;
  height: 32px;
  cursor: pointer;
  font-size: 14px;
  }
  .button-row {
    display: flex;
    gap: 10px;
    -webkit-app-region: no-drag;
  }
</style>
</head>
<body>
  <div id="mascot" class="mascot">
    <div class="mascot-inner">
      <svg viewBox="0 0 160 165" width="100%" height="100%">
        <path d="M 20 90 C 5 70 20 40 50 35 C 60 10 100 10 110 35 C 140 40 155 70 140 90 C 155 115 135 145 105 145 C 95 160 65 160 55 145 C 25 145 5 115 20 90 Z" fill="#54585A"/>
        <circle cx="60" cy="85" r="6" fill="#F5F5F5"/>
        <circle cx="100" cy="85" r="6" fill="#F5F5F5"/>
        <path d="M 65 105 Q 80 115 95 105" stroke="#F5F5F5" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="speech-bubble" id="speechBubble"></div>
  </div>
  <div class="speech-bubble" id="speechBubble"></div>
  <div class="button-row">
    <button id="AddTask_btn">➕</button>
    <button id="ViewTask">📋</button>
  </div>
  <script src="./renderer.js"></script>
</body>
</html>
