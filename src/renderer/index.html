<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskPet</title>
    <style>
  html {
    background: transparent;
  }
  body {
    margin: 0;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    -webkit-app-region: drag;
  }
  .mascot {
    width: 100px;
    height: 100px;
    background: #54585a;
    border-radius: 50%;
    position: relative;
    animation: float 2.5s ease-in-out infinite;
    -webkit-app-region: no-drag;
  }
  .eye {
    width: 14px;
    height: 14px;
    background: #f5f5f5;
    border-radius: 50%;
    position: absolute;
    top: 36px;
  }
  .mouth {
    width: 20px;
    height: 15px;
    border-bottom: 3px solid #F5F5F5;
    border-radius: 0 0 20px 20px;
    position: absolute;
    top: 62px;
    left: 40px;
  }
  @keyframes float {
    0% {
        transform: translateY(0px);
    }
    50% {
        transform: translateY(-6px);
    }
    100% {
        transform: translateY(0px);
    }
}
.speech-bubble {
  position: absolute;
  background: rgba(40, 40, 40, 0.95);
  color: white;
  padding: 8px 12px;
  border-radius: 12px;
  top: -70px;
  opacity: 0;
  visibility: hidden;
  left: 50%;
  transform: translateX(-50%);
  white-space: normal;
  text-align: center;
  width: max-content;
  max-width: 160px;
}
.speech-bubble.show {
  opacity: 1;
  visibility: visible;
}

#AddTask_btn {
  -webkit-app-region: no-drag;
  background: #54585a;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 8px 14px;
  cursor: pointer;
  font-size: 12px;
  }
</style>
</head>
<body>
  <div class="mascot" id="mascot">
    <div class="eye" id="eyeLeft" style="left: 25px;"></div>
    <div class="eye" id="eyeRight" style="left: 60px;"></div>
    <div class="mouth"></div>
    <div class="speech-bubble" id="speechBubble"></div>
  </div>
  <button id="AddTask_btn">Agregar Tarea</button>
  <script src="./renderer.js"></script>
</body>
</html>
